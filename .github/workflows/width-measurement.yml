# The measurement behind the choice of the normative job's verifier width
# (SPEC.md §9.4, §22.11). Manual only, and not part of the acceptance gate: it
# decides which width `LEXLEAN_VV_WIDTH` may be set to, and `ci.yml` is what
# runs the gate at it.
#
# One job per width, all on the runner label dispatched, each verifying the
# same example (by default `uor-atlas`) from a clean checkout of the same
# commit; then one job judges the rows: the verified evidence of every width
# must equal width 1's (attestation ID and digest of the verified directory),
# the peak resident set and swap of its process tree must stay inside the
# runner's memory, and the wall-time reduction against width 1 is reported
# against the 25 percent criterion. A job stops its own run, and records why,
# if the runner's free memory falls below the floor, so that a width the
# runner cannot hold is a recorded rejection and not a lost runner.
#
# Provisioning, by the repository owner: a larger runner whose label is passed
# as `runner`, with enough memory for the widths in `widths` (the peak at
# width 1 on the 16 GB runner was 14.4 GB). Nothing is installed or cached
# beyond what `ci.yml` installs.
name: width-measurement

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label to measure on (a larger runner with the memory for the widths)
        required: true
        type: string
      example:
        description: The example to verify
        required: false
        default: uor-atlas
        type: string
      widths:
        description: JSON list of widths to measure, starting with 1
        required: false
        default: "[1, 2, 3, 4]"
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  measure:
    name: ${{ inputs.example }} at width ${{ matrix.width }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        width: ${{ fromJSON(inputs.widths) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Install elan and the pinned Lean toolchain
        run: |
          set -euo pipefail
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      # Built before the measurement so that the build is not in the time.
      - name: Build the gate's binary
        run: cargo build -p xtask
      - name: Measure the width
        run: cargo xtask measure-width --example "${{ inputs.example }}" --width "${{ matrix.width }}" --out ci-evidence/width
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: width-${{ matrix.width }}
          path: ci-evidence/width
          if-no-files-found: error
          retention-days: 30

  judge:
    name: judge the widths
    needs: measure
    if: ${{ !cancelled() }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: width-*
          path: ci-evidence/rows
      - name: Judge the measurements
        run: cargo xtask measure-width --example "${{ inputs.example }}" --combine ci-evidence/rows --out ci-evidence/judgement
      - name: Report the judgement
        if: ${{ !cancelled() }}
        run: cat ci-evidence/judgement/width-measurement.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: width-judgement
          path: ci-evidence/judgement
          if-no-files-found: error
          retention-days: 30
