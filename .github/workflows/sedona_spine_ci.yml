name: Sedona Spine CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Enforce Zero-Drift Toolchain
        run: |
          if ! grep -q '"fixedToolchain": true' lake-manifest.json; then
            echo "Error: lake-manifest.json must have fixedToolchain: true"
            exit 1
          fi
          TOOLCHAIN=$(cat lean-toolchain | tr -d '[:space:]')
          if [ "$TOOLCHAIN" != "leanprover/lean4:v4.33.0-rc2" ]; then
            echo "Error: lean-toolchain must pin to leanprover/lean4:v4.33.0-rc2"
            exit 1
          fi

      - name: Proof Debt Detection (sorry and axiom)
        run: |
          if grep -r "sorry" lean/ | grep -v "test/"; then
            echo "Error: Found 'sorry' in Lean proofs!"
            exit 1
          fi
          # Ensure every axiom is tracked in the ledger
          LEAN_AXIOMS=$(grep -r "axiom " lean/ | wc -l)
          LEDGER_AXIOMS=$(grep -c "AX-" docs/PIRTM-axiom-ledger.md || echo "0")
          if [ "$LEAN_AXIOMS" -ne "$LEDGER_AXIOMS" ]; then
            echo "Error: Mismatch between number of axioms in code ($LEAN_AXIOMS) and Axiom Ledger ($LEDGER_AXIOMS)"
            exit 1
          fi

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Run UORC Mandatory Gates (Epic 17)
        run: |
          cd packages/compression-main
          just vv
