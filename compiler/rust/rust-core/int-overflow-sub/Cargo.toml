[package]
name = "int_overflow_sub_core"
version = "1.0.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
type_complexity = "allow"
manual_unwrap_or = "allow"
manual_unwrap_or_default = "allow"
