# The closed Lean compiler-front-end interface of named-root extraction
# (SPEC.md §22.10). Every Lean operation and LCNF data type the extraction
# adapter uses is listed with its exact signature at the pinned revision and
# the SHA-256 of the toolchain source file that defines it. Lean's behavior is
# an external authority (LEAN-LCNF-4-32-1): these rows cite it, they do not
# prove it. Each call row is re-checked on every extraction by a signature
# probe that pinned Lean must elaborate; each type row is checked by the
# adapter's exhaustive matches, which Lean rejects if a constructor changes.

spec = "lexlean/lcnf-authority/1"
authority = "LEAN-LCNF-4-32-1"
lean_version = "4.32.1"
lean_githash = "f054605aea4b840552cca2e725580bffd1e1b704"

