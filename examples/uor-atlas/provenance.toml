# examples/uor-atlas/provenance.toml --- the Atlas label plane provenance ledger.
#
# A machine-readable transcription of the checkpoint facts `MIGRATION.md`
# records at commit `f972285f...`, in the exact spelling `cargo xtask
# atlas-prov` re-derives. The ledger lives here because it must not
# participate in the compiler-semantics digest: the embedded normative data
# (`language/`, `schemas/`, `tests/golden/*`) cannot be extended without a
# semantics bump, and a provenance record that moved the digest would defeat
# itself. Changing this file changes no digest (`project_config_sha256`
# covers only the serialized project configuration).
#
# ADR-PML-058 binds the Atlas label plane to this checkpoint: the live
# corpus must be byte-equal to the recorded native source tree, the sample
# labels below must be declared exactly once by the live corpus, every
# label-shaped citation in repository documentation must resolve to a live,
# withdrawn, or non-denotable register label, and the identities recorded
# here must be re-derivable from the local git object database (no network).
#
# The sample is the deterministic subset of the S-number plane the shared
# label cross-check compares first: the four labels the in-repo ADR
# documentation cites today (`S4`, `S37`, `S38`, `S43`). Extend `sample`
# when the Foundry side grows a formal module a new label covers.

spec = "lexlean/atlas-providence/1"

# The deterministic shared-label sample of the S-number plane. The gate
# re-derives liveness for exactly these labels on every `vv` run and prints
# their native declarations.
sample = ["S4", "S37", "S38", "S43"]

# The frozen checkpoint: the migration commit, the two trees it compared, and
# the counts and run facts `MIGRATION.md` reports. The native source tree is
# the byte-equality anchor; the input Lean tree is the independently authored
# corpus the migration converted.
