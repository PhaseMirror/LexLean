name = "lexlean"
defaultTargets = ["Spec", "Proofs", "ADR"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.22.0"

[[lean_lib]]
name = "Spec"
srcDir = "lean/specs"

[[lean_lib]]
name = "Proofs"
srcDir = "lean/proofs"

[[lean_lib]]
name = "ADR"
srcDir = "lean/ADR"
